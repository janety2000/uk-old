name: MyJobMag Scraper (UK)

on:
  schedule:
    - cron: "15,45 * * * *"   # offset from the NG schedule so both don't
                              # fight over the same runner minute
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: myjobmag-scraper-uk
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull --ff-only origin "${{ github.ref_name }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          SITE_KEY: "uk"
          SITE_BASE_URL: "https://www.myjobmag.co.uk"
          SITE_LIST_PAGE_PATH: "/jobs/page/{page}"
          # ⚠️ Verify these before your first real run: visit
          # https://www.myjobmag.co.uk/jobs and check the "Last" pagination
          # link for the true highest page number. The referrer in one of
          # the pages you shared indicates page 400+ already exists, so
          # 500 below is a rough starting guess, not a confirmed value.
          START_PAGE: "500"
          END_PAGE: "1"
          PAGES_PER_RUN: "15"
          MAX_RUN_SECONDS: "1080"
        run: python myjobmag_scraper.py

      - name: Commit progress files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add processed_uk.csv current_page_uk.txt
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update UK scraper progress [skip ci]"
            if ! git push origin "HEAD:${{ github.ref_name }}"; then
              echo "❌ git push FAILED — progress from this run will NOT persist to the next run."
              echo "   Check Settings → Actions → General → Workflow permissions."
              exit 1
            fi
            echo "✅ Progress committed and pushed."
          fi
